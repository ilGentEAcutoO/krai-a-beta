<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" width="1280" height="850" role="img" aria-labelledby="t d">
  <title id="t">KRAI-A beta architecture</title>
  <desc id="d">Browser talks to a Cloudflare Worker. Realtime audio goes through a VoiceCall Durable Object to Meta Muse Voice Transcribe. Each caller line goes T1 rules, Muse Spark, code policy, optional Muse Wonder, then an action; a scam call can enter trap mode. Budget and RateLimit Durable Objects guard spend. The proof page is static.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; font-size: 13px; }
      .h { font-size: 15px; font-weight: 700; }
      .hs { font-size: 14px; font-weight: 700; }
      .m { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #334155; }
      .s { font-size: 12px; fill: #475569; }
      .lbl { font-size: 11.5px; fill: #475569; }
      .band { font-size: 13px; font-weight: 700; fill: #64748b; letter-spacing: 1px; }
      .title { font-size: 20px; font-weight: 700; }
      .ln { stroke: #4a5568; stroke-width: 1.6; fill: none; }
      .dash { stroke-dasharray: 5 4; }
      .browser { fill: #f4f5f7; stroke: #8a94a6; }
      .cf { fill: #fff5eb; stroke: #e8590c; }
      .meta { fill: #eef3ff; stroke: #3b5bdb; }
      .metai { fill: #ffffff; stroke: #3b5bdb; }
      .code { fill: #ebfbee; stroke: #2b8a3e; }
      .neutral { fill: #ffffff; stroke: #94a3b8; }
      rect { stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="850" fill="#fbfaf7"/>
  <text x="30" y="38" class="title">KRAI-A beta: how a call is heard, judged and handled</text>
  <text x="30" y="60" class="s">Muse Spark decides the verdict; a fixed rule in code acts on it. The Meta API key never leaves the server.</text>

  <!-- ===== Runtime band ===== -->
  <text x="30" y="84" class="band">RUNTIME</text>

  <!-- Browser -->
  <rect x="30" y="92" width="220" height="288" rx="10" class="browser"/>
  <text x="44" y="118" class="h">Browser</text>
  <text x="44" y="136" class="s">/demo-live page</text>
  <text x="44" y="164">Mic → AudioWorklet</text>
  <text x="44" y="182" class="m">PCM 16-bit, 24 kHz</text>
  <text x="44" y="208">Type a caller line, or</text>
  <text x="44" y="226">replay a sample call</text>
  <text x="44" y="252">Turnstile → 30-min</text>
  <text x="44" y="270">session token</text>
  <text x="44" y="296">Verdict chip per turn,</text>
  <text x="44" y="314">trap timer + intel list</text>
  <text x="44" y="340">Voice out: Gemini TTS</text>
  <text x="44" y="358" class="m">voice only · browser fallback</text>

  <!-- Worker -->
  <rect x="320" y="92" width="340" height="288" rx="10" class="cf"/>
  <text x="334" y="118" class="h">Cloudflare Worker (Hono)</text>
  <text x="334" y="136" class="s">beta.krai-a.com · Smart Placement</text>
  <text x="334" y="162" class="hs">protect() on every paid route</text>
  <text x="334" y="180" class="s">session · rate limit · body caps (413)</text>
  <text x="334" y="196" class="s">reserve worst-case $ → settle real $</text>
  <text x="334" y="212" class="s">kill switch (503 paused / budget)</text>
  <text x="334" y="240" class="m">WS   /api/voice/live</text>
  <text x="334" y="258" class="m">POST /api/verdict/turn</text>
  <text x="334" y="276" class="m">POST /api/verdict/escalate</text>
  <text x="334" y="294" class="m">POST /api/trap/reply</text>
  <text x="334" y="312" class="m">POST /api/voice/file</text>
  <text x="334" y="330" class="m">POST /api/session</text>
  <text x="334" y="348" class="m">GET  /api/health · /api/config</text>
  <text x="334" y="368" class="s">Meta key = Worker secret only</text>

  <!-- Browser <-> Worker -->
  <line x1="250" y1="170" x2="318" y2="170" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="258" y="162" class="lbl">WSS</text>
  <text x="258" y="186" class="lbl">audio</text>
  <line x1="250" y1="262" x2="318" y2="262" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="258" y="254" class="lbl">HTTPS</text>
  <text x="258" y="278" class="lbl">JSON</text>

  <!-- Durable Objects -->
  <rect x="710" y="92" width="240" height="138" rx="10" class="cf"/>
  <text x="724" y="118" class="h">VoiceCall DO</text>
  <text x="724" y="136" class="s">one per call · Hibernation API</text>
  <text x="724" y="160">Sends auth handshake,</text>
  <text x="724" y="178">relays PCM up, events down</text>
  <text x="724" y="200" class="s">alarm closes at 10 min</text>
  <text x="724" y="218" class="s">settles $ by seconds streamed</text>

  <rect x="710" y="244" width="240" height="62" rx="10" class="cf"/>
  <text x="724" y="268" class="hs">Budget DO</text>
  <text x="724" y="289" class="s">one global daily USD cap</text>

  <rect x="710" y="318" width="240" height="62" rx="10" class="cf"/>
  <text x="724" y="342" class="hs">RateLimit DO</text>
  <text x="724" y="363" class="s">per salted IP hash, never raw IP</text>

  <line x1="660" y1="150" x2="708" y2="150" class="ln" marker-end="url(#a)"/>
  <line x1="660" y1="275" x2="708" y2="275" class="ln dash" marker-end="url(#a)"/>
  <line x1="660" y1="349" x2="708" y2="349" class="ln dash" marker-end="url(#a)"/>

  <!-- Meta Model API -->
  <rect x="1000" y="92" width="250" height="288" rx="10" class="meta"/>
  <text x="1014" y="118" class="h">Meta Model API</text>
  <rect x="1012" y="130" width="226" height="70" rx="8" class="metai"/>
  <text x="1024" y="152" class="hs">Muse Voice Transcribe 1.0</text>
  <text x="1024" y="170" class="s">realtime ASR socket, Thai bias</text>
  <text x="1024" y="187" class="s">partial + final per turn</text>
  <rect x="1012" y="210" width="226" height="74" rx="8" class="metai"/>
  <text x="1024" y="232" class="hs">Muse Spark 1.2</text>
  <text x="1024" y="250" class="s">verdict per turn (minimal)</text>
  <text x="1024" y="267" class="s">trap lines + intel extraction</text>
  <rect x="1012" y="294" width="226" height="74" rx="8" class="metai"/>
  <text x="1024" y="316" class="hs">Muse Wonder 1.0</text>
  <text x="1024" y="334" class="s">grey-zone second opinion</text>
  <text x="1024" y="351" class="s">(effort medium) + evidence</text>

  <!-- DO <-> Voice -->
  <line x1="950" y1="165" x2="1010" y2="165" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- Worker -> Spark / Wonder (routed under the DO column) -->
  <path d="M660,368 H685 V398 H1125 V382" class="ln" marker-end="url(#a)"/>
  <text x="700" y="414" class="lbl">HTTPS chat completions, strict JSON schema (verdict, escalate, trap routes)</text>

  <!-- Static + offline -->
  <rect x="320" y="430" width="340" height="44" rx="10" class="neutral"/>
  <text x="334" y="450" class="hs">Static assets (no model calls)</text>
  <text x="334" y="466" class="m">/  /demo-live  /showdown  /proof</text>
  <rect x="30" y="430" width="220" height="44" rx="10" class="neutral"/>
  <text x="44" y="450" class="hs">Offline, in the repo</text>
  <text x="44" y="466" class="s">corpus → fewshot · eval → proof</text>
  <line x1="250" y1="452" x2="318" y2="452" class="ln dash" marker-end="url(#a)"/>

  <!-- ===== Per-turn decision band ===== -->
  <line x1="30" y1="500" x2="1250" y2="500" stroke="#d6dbe3" stroke-width="1"/>
  <text x="30" y="526" class="band">EVERY CALLER TURN: WHO DECIDES WHAT</text>

  <rect x="30" y="540" width="140" height="112" rx="10" class="browser"/>
  <text x="42" y="564" class="hs">Caller line</text>
  <text x="42" y="584">final transcript</text>
  <text x="42" y="602">or a typed line</text>
  <text x="42" y="628" class="s">caller text is data,</text>
  <text x="42" y="644" class="s">never instructions</text>

  <rect x="198" y="540" width="165" height="112" rx="10" class="code"/>
  <text x="210" y="564" class="hs">T1 rules (code)</text>
  <text x="210" y="584">OTP / app install /</text>
  <text x="210" y="602">transfer-now / secrecy</text>
  <text x="210" y="628" class="s">reported as a candidate,</text>
  <text x="210" y="644" class="s">never decides alone</text>

  <rect x="391" y="540" width="195" height="112" rx="10" class="meta"/>
  <text x="403" y="564" class="hs">Muse Spark 1.2</text>
  <text x="403" y="584">6 few-shot train calls</text>
  <text x="403" y="602">verdict · tactic · conf</text>
  <text x="403" y="620">+ 9 risk signals</text>
  <text x="403" y="644" class="s">exact-match cache</text>

  <rect x="614" y="540" width="190" height="112" rx="10" class="code"/>
  <text x="626" y="564" class="hs">policy.js (code)</text>
  <text x="626" y="584">thresholds own every</text>
  <text x="626" y="602">consequence; a risk</text>
  <text x="626" y="620">signal blocks LEGIT</text>
  <text x="626" y="644" class="s">grey zone → Wonder</text>

  <rect x="832" y="540" width="165" height="112" rx="10" class="code"/>
  <text x="844" y="564" class="hs">Action</text>
  <text x="844" y="584" class="m">continue</text>
  <text x="844" y="602" class="m">take-message</text>
  <text x="844" y="620" class="m">hangup</text>
  <text x="844" y="644" class="s">+ verdict chip on page</text>

  <rect x="1025" y="540" width="225" height="248" rx="10" class="code"/>
  <text x="1037" y="564" class="hs">Trap mode (10 min)</text>
  <text x="1037" y="584">Spark 1.3 writes a slow</text>
  <text x="1037" y="602">line that plays for time</text>
  <text x="1037" y="626">guardReply + trap guard:</text>
  <text x="1037" y="644" class="s">no digits, money, codes,</text>
  <text x="1037" y="660" class="s">AI or trap words, else a</text>
  <text x="1037" y="676" class="s">tested canned line</text>
  <text x="1037" y="700">HMAC token caps it at</text>
  <text x="1037" y="718">10 min / 20 replies</text>
  <text x="1037" y="742">Intel: regex + Spark;</text>
  <text x="1037" y="760">every item quotes</text>
  <text x="1037" y="778">a caller line</text>

  <rect x="614" y="690" width="190" height="98" rx="10" class="meta"/>
  <text x="626" y="714" class="hs">Muse Wonder 1.0</text>
  <text x="626" y="734">grey zone only</text>
  <text x="626" y="752">verdict + verbatim</text>
  <text x="626" y="770">caller evidence quotes</text>

  <!-- flow arrows -->
  <line x1="170" y1="596" x2="196" y2="596" class="ln" marker-end="url(#a)"/>
  <line x1="363" y1="596" x2="389" y2="596" class="ln" marker-end="url(#a)"/>
  <line x1="586" y1="596" x2="612" y2="596" class="ln" marker-end="url(#a)"/>
  <line x1="804" y1="596" x2="830" y2="596" class="ln" marker-end="url(#a)"/>
  <line x1="997" y1="596" x2="1023" y2="596" class="ln" marker-end="url(#a)"/>
  <text x="1000" y="616" class="lbl">SCAM</text>
  <line x1="670" y1="652" x2="670" y2="688" class="ln" marker-end="url(#a)"/>
  <text x="592" y="675" class="lbl">escalate</text>
  <line x1="750" y1="688" x2="750" y2="654" class="ln" marker-end="url(#a)"/>
  <text x="758" y="675" class="lbl">guardEscalation</text>
  <text x="830" y="716" class="s">Wonder can raise suspicion,</text>
  <text x="830" y="733" class="s">never clear a call Spark saw</text>
  <text x="830" y="750" class="s">asking for money, codes, apps</text>
  <text x="830" y="767" class="s">or identity. Failure keeps</text>
  <text x="830" y="784" class="s">Spark's decision.</text>

  <!-- legend -->
  <rect x="30" y="812" width="16" height="16" rx="3" class="meta"/>
  <text x="54" y="825" class="s">Meta model (reports)</text>
  <rect x="210" y="812" width="16" height="16" rx="3" class="code"/>
  <text x="234" y="825" class="s">Code (decides)</text>
  <rect x="360" y="812" width="16" height="16" rx="3" class="cf"/>
  <text x="384" y="825" class="s">Cloudflare runtime</text>
  <rect x="530" y="812" width="16" height="16" rx="3" class="browser"/>
  <text x="554" y="825" class="s">Browser / input</text>
  <line x1="680" y1="820" x2="720" y2="820" class="ln dash"/>
  <text x="728" y="825" class="s">guard or offline path</text>
</svg>
