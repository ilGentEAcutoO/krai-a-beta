<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="fpw-title fpw-desc">
  <title id="fpw-title">Fork KRAI-A: what works on deploy, and the one piece you connect</title>
  <desc id="fpw-desc">Three boxes, left to right. One, your phone line to KRAI-A, drawn dashed: you connect this. Point call-forwarding from your number to your phone provider (any SIP or programmable-voice provider) and stream the call audio to KRAI-A's voice socket, with a small bridge you write for the provider you already use. Two, KRAI-A on your Cloudflare, which works the moment you deploy: Voice Transcribe, then Spark judges every sentence, Wonder takes the grey zone, code decides to hang up, take a message or stall, and a case report is written. Three, reports to your family's chat, built in and opt-in: Telegram, LINE or WhatsApp, contract-tested but not live-verified. Below, four steps: 1 fork and deploy with npm run deploy; 2 try it in your browser now at /demo-live with your mic or a recorded call; 3 turn on family reports with docs/ADAPTERS.md in about 5 minutes; 4 connect your phone line by streaming your provider's call audio to the voice socket, not built yet and our next step.</desc>
  <defs>
    <marker id="fpw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5F626A"/>
    </marker>
    <marker id="fpw-arrow-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#037A34"/>
    </marker>
  </defs>
  <style>
    .t{font-family:"IBM Plex Sans","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;fill:#111214}
    .h{font-size:19px;font-weight:700}
    .b{font-size:14.5px;fill:#46484F}
    .s{font-size:13px;fill:#5F626A}
    .k{font-size:11.5px;font-weight:700;letter-spacing:.08em}
    .m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;fill:#111214}
    .p{font-size:14px;font-weight:600}
  </style>
  <rect width="1100" height="560" fill="#FFFFFF"/>

  <!-- 1: you connect this (dashed) -->
  <rect x="20" y="20" width="318" height="300" rx="16" fill="#FFFFFF" stroke="#46484F" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="40" y="40" width="152" height="24" rx="12" fill="#F5F5F7" stroke="#46484F" stroke-dasharray="4 3"/>
  <text class="t k" x="116" y="56.5" text-anchor="middle" style="fill:#46484F">YOU CONNECT THIS</text>
  <text class="t h" x="40" y="96">① Your phone line</text>
  <text class="t h" x="40" y="120">→ KRAI-A</text>
  <text class="t b" x="40" y="154">Point call-forwarding from your</text>
  <text class="t b" x="40" y="174">number to your phone provider (any</text>
  <text class="t b" x="40" y="194">SIP or programmable-voice provider),</text>
  <text class="t b" x="40" y="214">and stream the call audio to</text>
  <text class="t b" x="40" y="234">KRAI-A's voice socket.</text>
  <text class="t b" x="40" y="270" font-weight="600" style="fill:#111214">A small bridge you write for the</text>
  <text class="t b" x="40" y="290" font-weight="600" style="fill:#111214">provider you already use.</text>

  <line x1="342" y1="170" x2="374" y2="170" stroke="#5F626A" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#fpw-arrow)"/>

  <!-- 2: KRAI-A on your Cloudflare (green, works on deploy) -->
  <rect x="380" y="20" width="400" height="300" rx="16" fill="#E8F8EE" stroke="#06C755" stroke-width="2"/>
  <rect x="400" y="40" width="236" height="24" rx="12" fill="#037A34"/>
  <text class="t k" x="518" y="56.5" text-anchor="middle" style="fill:#FFFFFF">WORKS THE MOMENT YOU DEPLOY</text>
  <text class="t h" x="400" y="96">② KRAI-A on your Cloudflare</text>
  <g>
    <rect x="400" y="112" width="360" height="30" rx="8" fill="#FFFFFF" stroke="#9EDDB8"/>
    <text class="t p" x="414" y="132">Voice Transcribe <tspan class="s" font-weight="400">· speech to text, live</tspan></text>
    <line x1="420" y1="143" x2="420" y2="151" stroke="#037A34" stroke-width="2" marker-end="url(#fpw-arrow-g)"/>
    <rect x="400" y="154" width="360" height="30" rx="8" fill="#FFFFFF" stroke="#9EDDB8"/>
    <text class="t p" x="414" y="174">Spark <tspan class="s" font-weight="400">· judges every sentence</tspan></text>
    <line x1="420" y1="185" x2="420" y2="193" stroke="#037A34" stroke-width="2" marker-end="url(#fpw-arrow-g)"/>
    <rect x="400" y="196" width="360" height="30" rx="8" fill="#FFFFFF" stroke="#9EDDB8"/>
    <text class="t p" x="414" y="216">Wonder <tspan class="s" font-weight="400">· takes the grey zone</tspan></text>
    <line x1="420" y1="227" x2="420" y2="235" stroke="#037A34" stroke-width="2" marker-end="url(#fpw-arrow-g)"/>
    <rect x="400" y="238" width="360" height="30" rx="8" fill="#FFFFFF" stroke="#9EDDB8"/>
    <text class="t p" x="414" y="258">Code decides <tspan class="s" font-weight="400">· hang up · take a message · stall</tspan></text>
    <line x1="420" y1="269" x2="420" y2="277" stroke="#037A34" stroke-width="2" marker-end="url(#fpw-arrow-g)"/>
    <rect x="400" y="280" width="360" height="30" rx="8" fill="#037A34"/>
    <text class="t p" x="414" y="300" style="fill:#FFFFFF">Case report</text>
  </g>

  <line x1="784" y1="170" x2="816" y2="170" stroke="#5F626A" stroke-width="2.5" marker-end="url(#fpw-arrow)"/>

  <!-- 3: family chat (amber adapter) -->
  <rect x="822" y="20" width="258" height="300" rx="16" fill="#FEF5E3" stroke="#F5A524" stroke-width="2"/>
  <rect x="842" y="40" width="132" height="24" rx="12" fill="#8A5200"/>
  <text class="t k" x="908" y="56.5" text-anchor="middle" style="fill:#FFFFFF">BUILT IN, OPT-IN</text>
  <text class="t h" x="842" y="96">③ Reports to your</text>
  <text class="t h" x="842" y="120">family's chat</text>
  <rect x="842" y="140" width="218" height="30" rx="8" fill="#FFFFFF" stroke="#F0CF8C"/>
  <text class="t p" x="856" y="160">Telegram</text>
  <rect x="842" y="178" width="218" height="30" rx="8" fill="#FFFFFF" stroke="#F0CF8C"/>
  <text class="t p" x="856" y="198">LINE</text>
  <rect x="842" y="216" width="218" height="30" rx="8" fill="#FFFFFF" stroke="#F0CF8C"/>
  <text class="t p" x="856" y="236">WhatsApp</text>
  <text class="t s" x="842" y="274">Off until you turn it on.</text>
  <text class="t s" x="842" y="294">Contract-tested, not live-verified.</text>

  <!-- steps -->
  <text class="t k" x="20" y="364" style="fill:#5F626A">YOUR PATH, IN ORDER</text>
  <g>
    <rect x="20" y="378" width="254" height="160" rx="14" fill="#F5F5F7" stroke="#E4E5E8"/>
    <circle cx="48" cy="408" r="14" fill="#037A34"/>
    <text class="t" x="48" y="413" text-anchor="middle" font-size="14" font-weight="700" style="fill:#FFFFFF">1</text>
    <text class="t p" x="72" y="413" font-size="15.5">Fork + deploy</text>
    <rect x="36" y="432" width="140" height="26" rx="6" fill="#FFFFFF" stroke="#D2D4D9"/>
    <text class="t m" x="46" y="450">npm run deploy</text>
    <text class="t s" x="36" y="484">Your own copy on your own</text>
    <text class="t s" x="36" y="502">Cloudflare account, with your</text>
    <text class="t s" x="36" y="520">own spending caps.</text>
  </g>
  <g>
    <rect x="284" y="378" width="254" height="160" rx="14" fill="#F5F5F7" stroke="#E4E5E8"/>
    <circle cx="312" cy="408" r="14" fill="#037A34"/>
    <text class="t" x="312" y="413" text-anchor="middle" font-size="14" font-weight="700" style="fill:#FFFFFF">2</text>
    <text class="t p" x="336" y="413" font-size="15.5">Try it in your browser</text>
    <rect x="300" y="432" width="96" height="26" rx="6" fill="#FFFFFF" stroke="#D2D4D9"/>
    <text class="t m" x="310" y="450">/demo-live</text>
    <text class="t s" x="300" y="484">Right away: talk into your mic,</text>
    <text class="t s" x="300" y="502">or play a recorded call, and</text>
    <text class="t s" x="300" y="520">watch each sentence get judged.</text>
  </g>
  <g>
    <rect x="548" y="378" width="254" height="160" rx="14" fill="#F5F5F7" stroke="#E4E5E8"/>
    <circle cx="576" cy="408" r="14" fill="#8A5200"/>
    <text class="t" x="576" y="413" text-anchor="middle" font-size="14" font-weight="700" style="fill:#FFFFFF">3</text>
    <text class="t p" x="600" y="413" font-size="15.5">Turn on family reports</text>
    <rect x="564" y="432" width="150" height="26" rx="6" fill="#FFFFFF" stroke="#D2D4D9"/>
    <text class="t m" x="574" y="450">docs/ADAPTERS.md</text>
    <text class="t s" x="564" y="484">About 5 minutes: add your</text>
    <text class="t s" x="564" y="502">chat's secrets, then send</text>
    <text class="t s" x="564" y="520">yourself a test report.</text>
  </g>
  <g>
    <rect x="812" y="378" width="268" height="160" rx="14" fill="#FFFFFF" stroke="#46484F" stroke-width="1.5" stroke-dasharray="7 5"/>
    <circle cx="840" cy="408" r="13" fill="#FFFFFF" stroke="#46484F" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text class="t" x="840" y="413" text-anchor="middle" font-size="14" font-weight="700">4</text>
    <text class="t p" x="864" y="413" font-size="15.5">Connect your phone line</text>
    <text class="t s" x="828" y="452">Stream your provider's call audio</text>
    <text class="t s" x="828" y="470">to the voice socket</text>
    <text class="t m" x="828" y="488" font-size="12.5">/api/voice/live</text>
    <text class="t s" x="828" y="520" font-weight="600" style="fill:#46484F">Not built yet: our next step.</text>
  </g>
</svg>
